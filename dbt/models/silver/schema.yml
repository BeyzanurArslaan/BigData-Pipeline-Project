version: 2

models:
  - name: orders
    description: Cleaned Silver orders table with one deterministic row per `order_id`.
    columns:
      - name: order_id
        description: Business key for the order.
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer identifier used to link to the Silver customers model.
        tests:
          - not_null
          - relationships:
              to: ref('customers')
              field: customer_id
      - name: order_status
        description: Current order lifecycle status.
        tests:
          - not_null
          - accepted_values:
              values: ['approved', 'canceled', 'created', 'delivered', 'invoiced', 'processing', 'shipped', 'unavailable']
      - name: order_purchase_timestamp
        description: Timestamp when the order was placed.
        tests:
          - not_null
      - name: order_purchase_date_key
        description: Integer date key derived from the order purchase timestamp.
        tests:
          - not_null

  - name: order_items
    description: Cleaned Silver order items table with deterministic deduplication on order and item number.
    tests:
      - unique_combination_of_columns:
          column_names: ['order_id', 'order_item_id']
    columns:
      - name: order_id
        description: Order business key.
        tests:
          - not_null
          - relationships:
              to: ref('orders')
              field: order_id
      - name: order_item_id
        description: Item sequence number within the order.
        tests:
          - not_null
      - name: product_id
        description: Product identifier associated with the item.
        tests:
          - not_null
          - relationships:
              to: ref('products')
              field: product_id
      - name: seller_id
        description: Seller identifier associated with the item.
        tests:
          - not_null
          - relationships:
              to: ref('sellers')
              field: seller_id
      - name: price
        description: Item price before freight.
        tests:
          - positive_value
      - name: freight_value
        description: Freight charge associated with the item.
        tests:
          - non_negative_value
      - name: item_gross_value
        description: Support field equal to price plus freight.
        tests:
          - non_negative_value
      - name: order_items_gross_total
        description: Support field with the total gross value for all items in the order.
        tests:
          - non_negative_value

  - name: order_payments
    description: Cleaned Silver payment records with order-grain aggregates and deterministic primary payment selection.
    tests:
      - unique_combination_of_columns:
          column_names: ['order_id', 'payment_sequential']
    columns:
      - name: order_id
        description: Order business key.
        tests:
          - not_null
          - relationships:
              to: ref('orders')
              field: order_id
      - name: payment_sequential
        description: Deterministic payment sequence inside the order.
        tests:
          - not_null
      - name: payment_type
        description: Payment method from the source record.
        tests:
          - not_null
      - name: payment_installments
        description: Number of installments used for the payment.
        tests:
          - not_null
      - name: payment_value
        description: Payment amount on the record.
        tests:
          - positive_value
      - name: order_payment_value
        description: Total payment value aggregated at the order grain.
        tests:
          - positive_value
      - name: payment_record_count
        description: Number of payment rows that belong to the order.
        tests:
          - positive_value
      - name: primary_payment_type
        description: Payment type from the lowest payment_sequential value.
        tests:
          - not_null
      - name: primary_payment_installments
        description: Installment count from the primary payment record.
        tests:
          - not_null

  - name: order_reviews
    description: Cleaned Silver reviews table with a deterministic dedupe key for rows missing review_id.
    columns:
      - name: review_id
        description: Original review identifier from the source system.
      - name: review_dedup_key
        description: Deterministic fallback key used when review_id is null.
        tests:
          - not_null
          - unique
      - name: order_id
        description: Order identifier associated with the review.
        tests:
          - not_null
          - relationships:
              to: ref('orders')
              field: order_id
      - name: review_score
        description: Numeric customer review score on the 1-to-5 scale.
        tests:
          - value_between:
              min_value: 1
              max_value: 5
      - name: review_creation_date
        description: Timestamp when the review was created.
      - name: review_answer_timestamp
        description: Timestamp when the review was answered.

  - name: customers
    description: Cleaned Silver customer dimension-ready entity.
    columns:
      - name: customer_id
        description: Business key for the customer record.
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: Stable customer identifier shared across multiple orders.
      - name: customer_zip_code_prefix
        description: Customer ZIP code prefix as an integer.
      - name: customer_city
        description: Customer city.
      - name: customer_state
        description: Customer state.

  - name: sellers
    description: Cleaned Silver seller dimension-ready entity.
    columns:
      - name: seller_id
        description: Business key for the seller record.
        tests:
          - not_null
          - unique
      - name: seller_zip_code_prefix
        description: Seller ZIP code prefix as an integer.
      - name: seller_city
        description: Seller city.
      - name: seller_state
        description: Seller state.

  - name: products
    description: Cleaned Silver product dimension-ready entity.
    columns:
      - name: product_id
        description: Business key for the product record.
        tests:
          - not_null
          - unique
      - name: product_category_name
        description: Original product category name from the source data.
      - name: product_name_length
        description: Product name length as a numeric value.
      - name: product_description_length
        description: Product description length as a numeric value.
      - name: product_photos_qty
        description: Number of product photos.
      - name: product_weight_g
        description: Product weight in grams.
      - name: product_length_cm
        description: Product length in centimeters.
      - name: product_height_cm
        description: Product height in centimeters.
      - name: product_width_cm
        description: Product width in centimeters.
