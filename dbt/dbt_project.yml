name: olist_analytics
version: 1.0.0
config-version: 2

profile: olist_analytics

model-paths:
  - models

macro-paths:
  - macros

test-paths:
  - tests

seed-paths:
  - seeds

snapshot-paths:
  - snapshots

target-path: target

clean-targets:
  - target
  - dbt_packages
  - logs

models:
  olist_analytics:
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
